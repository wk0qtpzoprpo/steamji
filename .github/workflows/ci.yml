# CI：代码质量门（只测试与构建，不部署）
# 触发：推送 main 或手动点击"Run workflow"
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
